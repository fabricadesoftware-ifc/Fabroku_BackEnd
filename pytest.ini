[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    integration: marks tests as integration tests (require SSH/Celery/GitHub)
    unit: marks tests as unit tests (fast, use fakes)
    slow: marks tests as slow
