server {
    listen 80;
    server_name _;

    # /srv/current is a symlink swapped atomically by publish.py on every deploy.
    # Nginx never restarts/reloads between deploys: it just follows whatever
    # `current` points to on the next request.
    root /srv/current;
    index index.html;

    location / {
        # SPA fallback so Vue Router history mode works.
        try_files $uri $uri/ /index.html;
    }

    location = /__release__ {
        # Cheap way to prove which immutable release is actually being served.
        alias /srv/current/__release__;
        default_type text/plain;
    }
}
