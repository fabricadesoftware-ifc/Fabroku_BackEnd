services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: fabroku
      MINIO_ROOT_PASSWORD: fabroku12345
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - static_poc_net

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./data:/srv:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - minio
    networks:
      - static_poc_net

volumes:
  minio_data:

networks:
  static_poc_net:
    name: static_poc_net
